<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesley Olegário - Web Dev</title>
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Reset e corpo */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    /* Container central */
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
      animation: fadeIn 1.5s ease-in-out;
    }

    /* Foto de perfil */
    img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #00c6ff;
      margin-bottom: 15px;
      box-shadow: 0 0 15px #00c6ff;
    }

    /* Nome e descrição */
    h1 {
      margin: 10px 0;
      font-size: 24px;
      color: #00c6ff;
    }

    p {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 20px;
    }

    /* Botões de link */
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #00c6ff;
      color: #000;
      text-decoration: none;
      padding: 12px;
      margin: 10px 0;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(0,198,255,0.6);
    }

    .link:hover {
      background: #00eaff;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0,234,255,0.9);
    }

    /* Animação de fade-in */
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- FOTO DE PERFIL -->
    <img src="img/perfil.jpg" alt="Foto de Wesley">

    <h1>Wesley Olegário</h1>
    <p>Desenvolvedor Web • HTML | CSS | JavaScript</p>

    <!-- BOTÕES DE LINKS -->
    <a class="link" href="https://github.com/Wesleyolegario" target="_blank"><i class="fab fa-github"></i> GitHub</a>
    <a class="link" href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
    <a class="link" href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    <a class="link" href="https://tiktok.com" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
  </div>
</body>
</html>
